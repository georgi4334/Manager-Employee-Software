# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: intime-postgres
    environment:
      POSTGRES_USER: intime
      POSTGRES_PASSWORD: intime
      POSTGRES_DB: intime
    ports:
      - '5432:5432'
    volumes:
      - intime-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intime -d intime']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  intime-pgdata:
