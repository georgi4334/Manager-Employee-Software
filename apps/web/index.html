<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- One-time links carry a token in the URL; never leak it through the Referer header. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>InTime</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app on its first render; mirrors shared/components/Splash.tsx. -->
      <div class="splash" aria-hidden="true">
        <svg class="splash-mark" viewBox="0 0 32 32" width="64" height="64">
          <rect class="splash-tile" width="32" height="32" rx="9" />
          <g class="splash-line" stroke-width="2.75" stroke-linecap="round">
            <path d="M20.3 11.85A7.5 7.5 0 1 1 11.7 11.85" />
            <path d="M16 14.5V18h3.25" stroke-linejoin="round" />
          </g>
          <circle class="splash-ink" cx="16" cy="7.4" r="2.1" />
        </svg>
        <span class="splash-name">InTime</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
