<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- One-time links carry a token in the URL; never leak it through the Referer header. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>InTime</title>
    <!--
      The boot screen must look right before any script or stylesheet has loaded, so its few rules are
      inline. The values mirror tokens.css (--sidebar, --sidebar-foreground, --sidebar-border, --brand);
      change them together (ADR 0033). The same classes in globals.css take over once the app runs.
    -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #170f0e;
        color: #ece5e2;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      .splash-mark {
        width: 4rem;
        height: 4rem;
        animation: splash-breathe 1.6s ease-in-out infinite alternate;
      }
      .splash-tile {
        fill: #f26a4b;
      }
      .splash-ink {
        fill: #170f0e;
      }
      .splash-line {
        fill: none;
        stroke: #170f0e;
      }
      .splash-name {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      .splash-bar {
        position: relative;
        width: 7rem;
        height: 3px;
        overflow: hidden;
        border-radius: 9999px;
        background: #2e2421;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #f26a4b;
        animation: splash-bar 1.2s cubic-bezier(0.32, 0.72, 0, 1) infinite;
      }
      @keyframes splash-breathe {
        from {
          opacity: 0.8;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app on its first render; mirrors shared/components/Splash.tsx. -->
      <div class="splash" aria-hidden="true">
        <svg class="splash-mark" viewBox="0 0 32 32" width="64" height="64">
          <rect class="splash-tile" width="32" height="32" rx="9" />
          <g class="splash-line" stroke-width="2.75" stroke-linecap="round">
            <path d="M20.3 11.85A7.5 7.5 0 1 1 11.7 11.85" />
            <path d="M16 14.5V18h3.25" stroke-linejoin="round" />
          </g>
          <circle class="splash-ink" cx="16" cy="7.4" r="2.1" />
        </svg>
        <span class="splash-name">InTime</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
